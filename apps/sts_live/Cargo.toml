[package]
name = "sts_live"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "live-trace"
path = "src/bin/live_trace.rs"

[[bin]]
name = "combat-research"
path = "src/bin/combat_research.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled-windows"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ruzstd = "0.8.3"
sts_core = { path = "../../crates/sts_core" }
sts_search = { path = "../../crates/sts_search" }
sts_verify = { path = "../../crates/sts_verify" }
