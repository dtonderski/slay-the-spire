[package]
name = "sts_verify"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sts_verify"
path = "src/bin/sts_verify.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sts_core = { path = "../sts_core" }

[build-dependencies]
sha2 = "0.10"
