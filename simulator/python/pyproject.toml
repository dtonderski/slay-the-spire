[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sts-sim"
version = "0.1.0"
description = "Typed Python bindings for the Slay the Spire simulator"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
rl = [
    "numpy>=2",
    "torch>=2.7",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.0",
    "maturin>=1.7,<2",
    "pytest>=8.0",
    "ruff>=0.12",
    "ty>=0.0.1",
]

[tool.maturin]
manifest-path = "../crates/py_sts/Cargo.toml"
python-source = "."
module-name = "sts_sim._native"
features = ["extension-module"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["sts_sim", "tests"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
blanket-ignore-comment = "error"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["ANN", "PYI", "PGH003"]
preview = true
