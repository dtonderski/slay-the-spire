[package]
name = "py_sts"
version = "0.1.0"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.27" }
serde = "1.0"
serde_json = "1.0"
sts_core = { path = "../sts_core" }
sts_live = { path = "../sts_live" }
sts_verify = { path = "../sts_verify" }
