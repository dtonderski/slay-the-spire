[package]
name = "sts_live"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "live-trace"
path = "src/bin/live_trace.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled-windows"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sts_core = { path = "../sts_core" }
sts_verify = { path = "../sts_verify" }
